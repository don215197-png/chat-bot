name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend tests (pytest vs Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chatbot
          POSTGRES_PASSWORD: chatbot
          POSTGRES_DB: chatbot_test
        ports:
          # Conftest/tests default to host port 5433 (5432 may be a local install).
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U chatbot -d chatbot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # OpenCode is never contacted: conftest stubs the upstream seam for every
      # test. The suite is provider-agnostic by design.
      - name: Install backend deps
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build
        run: npm run build