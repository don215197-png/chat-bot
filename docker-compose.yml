services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host 5433 (not 5432): a native local Postgres often already owns 5432.
      # Inside the compose network, services still reach the DB at db:5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    environment:
      # Postgres connection (libpq URI). Local docker network — no TLS needed.
      DATABASE_URL: postgresql://chatbot:chatbot@db:5432/chatbot
      # big-pickle needs no API key; override in prod environments only.
      OPENCODE_API_KEY: ""
      PORT: 8000
      # The nginx-served frontend origin must be CORS-allowlisted.
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - sites:/app/generated_sites
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the static build at image build time, then served by nginx.
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  sites: